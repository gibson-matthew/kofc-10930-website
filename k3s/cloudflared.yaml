# Cloudflare Tunnel for the council site. Same namespace as the app.
#
# The connector dials out to Cloudflare. It does not listen on port 80 or 443.
# Visitors still use HTTPS. Leave Cloudflare SSL/TLS on Full (strict).
# This replaces k3s/ingress.yaml and k3s/issuer.yaml for the public hostname.
# Do not apply those two files for the same name.
#
# Secret, created on the cluster. Do not commit the token:
#   name: koc10930-cloudflared
#   namespace: koc10930
#   key: tunnel-token
# The container reads that key as TUNNEL_TOKEN.
#
# The public hostname is not in this file and not in the Secret.
# On the tunnel, add a public hostname whose service is:
#   http://koc10930.koc10930.svc.cluster.local:8080
# That is Service koc10930, HTTP, port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: koc10930
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.6
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: koc10930-cloudflared
                  key: tunnel-token
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - name: metrics
              containerPort: 2000
