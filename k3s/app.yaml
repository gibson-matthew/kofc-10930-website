apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: koc10930
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koc10930
  namespace: koc10930
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koc10930
  template:
    metadata:
      labels:
        app: koc10930
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Uncomment if the GHCR package stays private. See setup.txt.
      # imagePullSecrets:
      #   - name: ghcr
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: koc10930-app
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: koc10930-app
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: koc10930-app
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do sleep 2; done
      containers:
        - name: app
          image: ghcr.io/example/kofc-10930-website:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: koc10930-app
            - configMapRef:
                name: koc10930-config
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
---
apiVersion: v1
kind: Service
metadata:
  name: koc10930
  namespace: koc10930
spec:
  selector:
    app: koc10930
  ports:
    - name: http
      port: 8080
      targetPort: http
